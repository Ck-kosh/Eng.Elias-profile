<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Kosh Portfolio</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<!-- ===== LOGIN ===== -->
<div class="admin-login" id="loginView">
  <form class="login-card" id="loginForm">
    <span class="brand-mark" style="margin:0 auto 1rem">K</span>
    <h2>Admin Login</h2>
    <p class="login-sub">Authorized access only</p>
    <input type="text" id="loginUser" placeholder="Username" required autocomplete="username">
    <input type="password" id="loginPass" placeholder="Password" required autocomplete="current-password">
    <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    <p class="login-hint" id="loginHint"></p>
    <p class="login-note"><br>Only for Kosh.</p>
  </form>
</div>

<!-- ===== DASHBOARD ===== -->
<div class="admin-app" id="appView" hidden>
  <aside class="admin-sidebar">
    <a href="index.html" class="brand"><span class="brand-mark">K</span><span class="brand-text">Kosh<em>.</em></span></a>
    <nav class="admin-nav">
      <button class="an-link active" data-tab="profile">👤 Profile &amp; Bio</button>
      <button class="an-link" data-tab="projects">💻 Projects</button>
      <button class="an-link" data-tab="services">🛡️ Services</button>
      <button class="an-link" data-tab="gallery">🖼️ Gallery</button>
      <button class="an-link" data-tab="contact">📞 Contact Info</button>
    </nav>
    <div class="sidebar-foot">
      <a href="index.html" class="btn btn-outline-dark btn-sm btn-block">← View Website</a>
      <button class="btn btn-primary btn-sm btn-block" id="saveAllBtn">💾 Save All Changes</button>
      <button class="btn-ghost-danger" id="logoutBtn">Log out</button>
    </div>
  </aside>

  <main class="admin-main">
    <!-- PROFILE TAB -->
    <section class="tab-panel active" id="tab-profile">
      <h2>Profile &amp; Biography</h2>
      <div class="admin-grid">
        <div class="admin-card">
          <h3>Basic Info</h3>
          <label>Display name<input type="text" id="pf-name"></label>
          <label>Tagline (home page)<textarea id="pf-tagline" rows="3"></textarea></label>
          <label>Biography<textarea id="pf-bio" rows="6"></textarea></label>
        </div>
        <div class="admin-card">
          <h3>Photo &amp; Skills</h3>
          <label>Profile photo — image URL<input type="text" id="pf-photo" placeholder="https://... or assets/profile.svg"></label>
          <div class="img-preview"><img id="pf-photo-preview" src="" alt="preview"></div>
          <label>Skills (comma separated)<textarea id="pf-skills" rows="4"></textarea></label>
        </div>
      </div>
    </section>

    <!-- PROJECTS TAB -->
    <section class="tab-panel" id="tab-projects">
      <div class="panel-head"><h2>Software Projects</h2><button class="btn btn-primary btn-sm" id="addProjectBtn">+ Add Project</button></div>
      <div id="projectsEditor"></div>
    </section>

    <!-- SERVICES TAB -->
    <section class="tab-panel" id="tab-services">
      <div class="panel-head"><h2>Security Services</h2><button class="btn btn-primary btn-sm" id="addServiceBtn">+ Add Service</button></div>
      <div id="servicesEditor"></div>
    </section>

    <!-- GALLERY TAB -->
    <section class="tab-panel" id="tab-gallery">
      <div class="panel-head"><h2>Gallery</h2><button class="btn btn-primary btn-sm" id="addGalleryBtn">+ Add Image</button></div>
      <div id="galleryEditor"></div>
    </section>

    <!-- CONTACT TAB -->
    <section class="tab-panel" id="tab-contact">
      <h2>Contact Information</h2>
      <div class="admin-grid">
        <div class="admin-card">
          <label>Phone<input type="tel" id="ct-phone"></label>
          <label>WhatsApp number (digits only, with country code)<input type="tel" id="ct-whatsapp"></label>
          <label>Email<input type="email" id="ct-email"></label>
          <label>Location<input type="text" id="ct-location"></label>
        </div>
        <div class="admin-card">
          <h3>Social Links</h3>
          <div id="socialsEditor"></div>
          <button class="btn btn-outline-dark btn-sm" id="addSocialBtn">+ Add Social Link</button>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>
<script src="js/data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
